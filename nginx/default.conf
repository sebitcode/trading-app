upstream crypto_orchestrator {
    # The host Nginx proxies to the Docker-managed app on loopback.
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name trading-app.sebitcode.dev;

    # Keep this location available for the initial Let's Encrypt certificate
    # and future renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://trading-app.sebitcode.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trading-app.sebitcode.dev;

    ssl_certificate /etc/letsencrypt/live/trading-app.sebitcode.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading-app.sebitcode.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:trading_app_tls:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /mcp {
        proxy_pass http://crypto_orchestrator;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://crypto_orchestrator;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
